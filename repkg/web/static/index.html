<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RePKG - Wallpaper Engine 解包工具</title>
<style>
  :root {
    --bg: #12151c;
    --panel: #1a1f2b;
    --panel-2: #222836;
    --border: #2d3446;
    --text: #e8ecf4;
    --muted: #8b95ab;
    --accent: #4f9cf9;
    --accent-2: #22c55e;
    --danger: #ef4444;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
  }
  header {
    padding: 16px 24px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 18px; cursor: pointer; color: var(--muted);
    border: none; background: none; font-size: 14px;
    border-bottom: 2px solid transparent; transition: all .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }

  /* 拖拽区 */
  .dropzone {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 48px 24px; text-align: center; cursor: pointer;
    transition: all .2s; background: var(--panel); margin-bottom: 20px;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent); background: var(--panel-2);
  }
  .dropzone .icon { font-size: 40px; margin-bottom: 12px; }
  .dropzone .main { font-size: 16px; margin-bottom: 6px; }
  .dropzone .hint { color: var(--muted); font-size: 12px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { color: var(--muted); font-size: 12px; }
  input[type=text], input[type=number] {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: 6px; font-size: 13px; min-width: 320px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; padding: 9px 18px;
    border-radius: 6px; font-size: 13px; cursor: pointer; transition: filter .15s;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
  label.check { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }

  /* 工程卡片网格 */
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .wall {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform .18s, border-color .18s;
    position: relative;
  }
  .wall:hover { transform: translateY(-3px); border-color: var(--accent); }
  .wall.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,156,249,.35); }
  .wall .pick {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); border-radius: 6px; cursor: pointer;
  }
  .wall .pick input { cursor: pointer; accent-color: var(--accent); width: 14px; height: 14px; }
  .wall .thumb {
    width: 100%; aspect-ratio: 16/9; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer; position: relative;
  }
  .wall .thumb img, .wall .thumb video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .wall .thumb .ph { color: var(--muted); font-size: 12px; }
  .wall .thumb .play {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 34px; opacity: 0;
    background: rgba(0,0,0,.35); transition: opacity .18s;
  }
  .wall .thumb:hover .play { opacity: 1; }
  .wall .info { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .wall .title {
    font-weight: 600; font-size: 13px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .wall .meta { color: var(--muted); font-size: 11px; }
  .wall .actions { display: flex; gap: 6px; padding: 0 14px 14px; }
  .wall .actions button { padding: 6px 10px; font-size: 12px; flex: 1; }

  /* 卡片左侧竖排操作条：解包按钮常驻左侧，不用滚到卡片底部 */
  .wall .side {
    position: absolute; left: 0; top: 0; bottom: 0; width: 42px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; z-index: 4;
    background: linear-gradient(90deg, rgba(0,0,0,.72), rgba(0,0,0,0));
    opacity: 0; transform: translateX(-8px);
    transition: opacity .18s, transform .18s;
    /* 隐藏时完全不可交互，避免看不见的按钮被误点 */
    pointer-events: none;
  }
  .wall:hover .side { opacity: 1; transform: translateX(0); }
  .wall .side button {
    width: 30px; height: 30px; padding: 0; border-radius: 6px;
    font-size: 15px; line-height: 1; display: flex;
    align-items: center; justify-content: center;
    background: var(--accent); color: #fff; border: none; cursor: pointer;
    pointer-events: none;
  }
  /* 只有悬停卡片、操作条可见时才允许点击 */
  .wall:hover .side button { pointer-events: auto; }
  .wall .side button:hover { filter: brightness(1.15); }
  .wall .side button.busy { background: var(--muted); pointer-events: none; }

  /* 分页 */
  .pager {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; flex-wrap: wrap; margin-top: 20px;
  }
  .pager button {
    min-width: 34px; padding: 6px 10px; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
  .pager button:disabled { opacity: .35; cursor: not-allowed; }
  .pager button.cur {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .pager .info { color: var(--muted); font-size: 12px; margin: 0 6px; }
  .pager select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 5px 8px; border-radius: 6px; font-size: 12px;
  }

  /* 模态框 */
  .modal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.82); align-items: center; justify-content: center;
  }
  .modal.open { display: flex; }
  .modal .box {
    background: var(--panel); border-radius: var(--radius); padding: 20px;
    max-width: 92vw; max-height: 88vh; overflow: auto; width: 1100px;
  }
  .modal .bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .modal .bar h3 { margin: 0; font-size: 15px; }
  .modal img, .modal video { max-width: 100%; border-radius: 6px; display: block; }

  .entries { font-family: Consolas, Monaco, monospace; font-size: 12px; }
  .entries div {
    padding: 4px 8px; border-bottom: 1px solid var(--panel-2);
    display: flex; justify-content: space-between; gap: 16px;
  }
  .entries .path { color: var(--text); word-break: break-all; }
  .entries .len { color: var(--muted); flex-shrink: 0; }

  .log {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font-family: Consolas, monospace; font-size: 11px;
    max-height: 260px; overflow: auto; white-space: pre-wrap;
    color: var(--muted); margin-top: 12px;
  }
  .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
  .msg.ok { background: rgba(34,197,94,.12); color: var(--accent-2); border: 1px solid rgba(34,197,94,.3); }
  .msg.err { background: rgba(239,68,68,.12); color: var(--danger); border: 1px solid rgba(239,68,68,.3); }

  /* 解包结果：固定在底部，工程库再长也能看到结果 */
  #libMsg.sticky {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(1080px, 92vw); max-height: 58vh; overflow: auto;
    z-index: 90; margin: 0;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }
  #libMsg.sticky .msg { margin-bottom: 0; }
  #libMsg.sticky .media-box { max-height: 40vh; overflow: auto; }
  #libMsg .close-result {
    position: absolute; top: 8px; right: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 3px 9px; border-radius: 5px;
    font-size: 12px; cursor: pointer;
  }
  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 13px; }
  .spin { display: inline-block; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  /* 解包结果里的媒体网格 */
  .media-box {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .media-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .media-title code {
    background: var(--bg); padding: 2px 6px; border-radius: 4px;
    font-size: 11px; color: var(--accent);
  }
  .media-grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .media-item {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  .media-thumb {
    width: 100%; aspect-ratio: 16/9; background: var(--bg);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .media-thumb img, .media-thumb video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .media-info { padding: 8px 9px; }
  .media-name {
    font-size: 11px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; margin-bottom: 2px;
  }
  .media-size { font-size: 10px; color: var(--muted); }

  /* 工程库工具栏 */
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px;
  }
  .toolbar .sel-count { font-size: 12px; color: var(--muted); min-width: 70px; }
  button.danger { background: var(--danger); }
  .wall .info .path {
    font-family: Consolas, Monaco, monospace; font-size: 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    opacity: .75;
  }

  /* 媒体项按钮组：常驻显示，带文字，不再是悬停才出现的小图标 */
  .media-btns {
    position: absolute; top: 6px; right: 6px; display: flex; gap: 5px;
  }
  .media-dl, .media-copy {
    background: rgba(10,12,18,.88); color: #fff;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; padding: 4px 9px; cursor: pointer;
    text-decoration: none; transition: all .15s; white-space: nowrap;
    backdrop-filter: blur(3px);
  }
  .media-dl:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .media-copy:hover { background: var(--accent); border-color: var(--accent); }
  .media-overlay {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 12px; color: #fff;
    background: rgba(0,0,0,.55); opacity: 0; transition: opacity .18s;
    pointer-events: none;
  }
  .media-thumb { position: relative; cursor: pointer; }
  .media-thumb:hover .media-overlay { opacity: 1; }

  /* 轻提示 */
  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 11px 20px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 8px 28px rgba(0,0,0,.45);
    opacity: 0; pointer-events: none; transition: all .22s; z-index: 200;
    max-width: 80vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { border-color: rgba(34,197,94,.5); }
  .toast.err { border-color: rgba(239,68,68,.5); color: #fca5a5; }

  /* ===== 左右任务侧栏 =====
     左侧：排队/进行中的解包任务
     右侧：已完成的解包任务（可直接下载 / 复制路径） */
  .task-rail {
    position: fixed; top: 0; bottom: 0; width: 320px;
    background: var(--panel); z-index: 150;
    display: flex; flex-direction: column;
    transition: transform .25s ease;
  }
  .task-rail.left {
    left: 0; border-right: 1px solid var(--border);
    transform: translateX(-100%);
    box-shadow: 4px 0 24px rgba(0,0,0,.4);
  }
  .task-rail.right {
    right: 0; border-left: 1px solid var(--border);
    transform: translateX(100%);
    box-shadow: -4px 0 24px rgba(0,0,0,.4);
  }
  .task-rail.open { transform: translateX(0); }

  /* 侧栏展开时主内容让位，避免被盖住 */
  body.rail-left-open main { margin-left: 320px; }
  body.rail-right-open main { margin-right: 320px; }
  body.rail-left-open main { transition: margin-left .25s ease; }
  body.rail-right-open main { transition: margin-right .25s ease; }

  .task-rail .rail-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 15px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .task-rail .rail-head h3 {
    margin: 0; font-size: 13px; display: flex; align-items: center; gap: 7px;
  }
  .task-rail .rail-head .n {
    background: var(--accent); color: #fff; border-radius: 9px;
    padding: 0 7px; font-size: 11px; font-weight: 600; line-height: 17px;
  }
  .task-rail .rail-head button {
    background: transparent; border: none; color: var(--muted);
    font-size: 17px; cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .task-rail .rail-head button:hover { color: var(--text); filter: none; }
  .task-rail .rail-body { flex: 1; overflow-y: auto; padding: 11px; }
  .task-rail .rail-foot {
    padding: 9px 14px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 11px; flex-shrink: 0;
  }

  .rail-fab {
    position: fixed; bottom: 18px; z-index: 151;
    display: none; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 9px 14px; border-radius: 8px;
    font-size: 13px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  .rail-fab:hover { border-color: var(--accent); }
  .rail-fab.show { display: flex; }
  .rail-fab.left { left: 14px; }
  .rail-fab.right { right: 14px; }
  .rail-fab .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .rail-fab .dot.ok { background: var(--accent-2); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* 单个任务 */
  .task {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 12px; margin-bottom: 10px;
  }
  .task .t-name {
    font-size: 12px; font-weight: 600; margin-bottom: 7px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .task .t-bar {
    height: 5px; background: var(--bg); border-radius: 3px;
    overflow: hidden; margin-bottom: 6px;
  }
  .task .t-bar i {
    display: block; height: 100%; background: var(--accent);
    border-radius: 3px; transition: width .25s ease;
  }
  .task.done .t-bar i { background: var(--accent-2); }
  .task.error .t-bar i { background: var(--danger); }
  .task .t-meta {
    display: flex; justify-content: space-between; gap: 8px;
    color: var(--muted); font-size: 10.5px;
  }
  .task .t-file {
    color: var(--muted); font-size: 10.5px; margin-top: 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: Consolas, Monaco, monospace;
  }
  .task .t-err { color: var(--danger); font-size: 11px; margin-top: 5px; }

  /* 已完成任务里的媒体操作 */
  .task .t-media { margin-top: 9px; }
  .task .t-mrow {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 0; border-top: 1px solid var(--border);
  }
  .task .t-mname {
    flex: 1; min-width: 0; font-size: 11px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .task .t-mbtns { display: flex; gap: 4px; flex-shrink: 0; }
  /* 下载 / 复制路径：带文字的按钮，不再是隐晦的小图标 */
  .task .mbtn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 9px; border-radius: 5px; font-size: 11px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); text-decoration: none; cursor: pointer;
    white-space: nowrap;
  }
  .task .mbtn:hover { border-color: var(--accent); color: #fff; background: var(--accent); }
  .task .mbtn.dl:hover { border-color: var(--accent-2); background: var(--accent-2); }
  .task .mbtn.cp:hover { border-color: var(--accent); }

  /* ===== 筛选栏 ===== */
  .filters {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .filters select, .filters input[type=text] {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; min-width: 0;
  }
  .filters input[type=text] { width: 180px; }
  .filters select:focus, .filters input:focus {
    outline: none; border-color: var(--accent);
  }
  .filters .f-label { color: var(--muted); font-size: 12px; }
  .filters .f-reset {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 11px; border-radius: 6px;
    font-size: 12px; cursor: pointer;
  }
  .filters .f-reset:hover { border-color: var(--accent); }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 4px;
    font-size: 10px; font-weight: 500; vertical-align: middle;
    border: 1px solid transparent;
  }
  .badge.rating-Everyone { background: rgba(34,197,94,.15); color: #86efac; border-color: rgba(34,197,94,.35); }
  .badge.rating-Teen { background: rgba(234,179,8,.15); color: #fde047; border-color: rgba(234,179,8,.35); }
  .badge.rating-Questionable { background: rgba(249,115,22,.15); color: #fdba74; border-color: rgba(249,115,22,.35); }
  .badge.rating-Mature { background: rgba(239,68,68,.15); color: #fca5a5; border-color: rgba(239,68,68,.35); }
  .badge.rating-Adult { background: rgba(190,18,60,.18); color: #fda4af; border-color: rgba(190,18,60,.4); }
  .badge.kind { background: rgba(79,156,249,.15); color: #93c5fd; border-color: rgba(79,156,249,.35); }

  /* ===== 目录历史 ===== */
  .hist { margin-top: 12px; }
  .hist .h-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 6px; cursor: pointer;
    font-size: 12px; color: var(--text);
    border: 1px solid transparent;
  }
  .hist .h-item:hover { background: var(--panel-2); border-color: var(--border); }
  .hist .h-path {
    flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; direction: rtl; text-align: left;
  }
  .hist .h-count { color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .hist .h-del {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; padding: 0 4px; flex-shrink: 0;
  }
  .hist .h-del:hover { color: var(--danger); filter: none; }
  .hist-empty { color: var(--muted); font-size: 12px; padding: 8px 2px; }
</style>
</head>
<body>
<header>
  <h1>RePKG</h1>
  <span class="sub">Wallpaper Engine PKG / TEX 解包工具</span>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="upload">拖拽导入</button>
    <button class="tab" data-tab="scan">目录扫描</button>
    <button class="tab" data-tab="library">工程库 <span id="count">(0)</span></button>
  </div>

  <!-- ============ 上传 ============ -->
  <div class="panel active" id="panel-upload">
    <div class="dropzone" id="dropzone">
      <div class="icon">📦</div>
      <div class="main">拖拽 .pkg 或 .tex 文件到此处</div>
      <div class="hint">或点击选择文件 · 支持批量</div>
      <input type="file" id="fileInput" multiple accept=".pkg,.tex" hidden>
    </div>
    <div id="uploadMsg"></div>
  </div>

  <!-- ============ 目录扫描 ============ -->
  <div class="panel" id="panel-scan">
    <div class="card">
      <h2>扫描服务器端目录</h2>
      <div class="row">
        <div class="field">
          <label>目录绝对路径（服务器可访问）</label>
          <input type="text" id="scanDir" placeholder="E:\\steamapps\\workshop\\content\\123">
        </div>
        <div class="field">
          <label>递归</label>
          <label class="check"><input type="checkbox" id="scanRecursive" checked> 包含子目录</label>
        </div>
        <button id="scanBtn">开始扫描</button>
      </div>
      <div class="hint" style="color:var(--muted);font-size:12px;margin-top:10px;">
        扫描后会递归找出所有 .pkg 文件并注册为工程，可在「工程库」中预览和解包。
      </div>
      <div class="hist" id="scanHistory"></div>
    </div>
    <div id="scanMsg"></div>
  </div>

  <!-- ============ 工程库 ============ -->
  <div class="panel" id="panel-library">
    <div id="libMsg"></div>
    <div class="filters">
      <span class="f-label">分类</span>
      <select id="filterKind" onchange="applyFilters()">
        <option value="">全部类型</option>
      </select>
      <select id="filterRating" onchange="applyFilters()">
        <option value="">全部分级</option>
      </select>
      <select id="filterTag" onchange="applyFilters()">
        <option value="">全部标签</option>
      </select>
      <input type="text" id="filterKeyword" placeholder="搜索标题…" oninput="debouncedFilter()">
      <button class="f-reset" onclick="resetFilters()">重置</button>
    </div>
    <div class="toolbar" id="selToolbar">
      <label class="check">
        <input type="checkbox" id="selAll" onchange="toggleSelectAll(this.checked)">
        全选
      </label>
      <span class="sel-count" id="selCount">已选 0 个</span>
      <label class="check">
        <input type="checkbox" id="delFiles" checked>
        同时删除解包的文件
      </label>
      <button class="danger" id="delBtn" disabled onclick="deleteSelected()">删除所选</button>
      <button class="ghost" onclick="loadProjects()">刷新</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="libEmpty">还没有导入任何工程</div>
    <div class="pager" id="pager"></div>
  </div>
</main>

<!-- 预览模态框 -->
<div class="modal" id="modal">
  <div class="box">
    <div class="bar">
      <h3 id="mTitle">预览</h3>
      <button class="ghost" onclick="closeModal()">关闭</button>
    </div>
    <div id="mBody"></div>
  </div>
</div>

<!-- 条目模态框 -->
<div class="modal" id="entriesModal">
  <div class="box" style="width:820px">
    <div class="bar">
      <h3 id="eTitle">包内条目</h3>
      <button class="ghost" onclick="document.getElementById('entriesModal').classList.remove('open')">关闭</button>
    </div>
    <div class="entries" id="eBody"></div>
  </div>
</div>

<!-- 左侧任务侧栏：排队 / 进行中的解包 -->
<div class="task-rail left" id="railLeft">
  <div class="rail-head">
    <h3>⏳ 进行中 <span class="n" id="leftCount">0</span></h3>
    <button onclick="toggleRail('left', false)" title="收起">✕</button>
  </div>
  <div class="rail-body" id="railLeftBody">
    <div class="hist-empty">暂无进行中的任务</div>
  </div>
  <div class="rail-foot">解包在后台进行，可继续浏览其它工程</div>
</div>

<!-- 右侧任务侧栏：已完成的解包 -->
<div class="task-rail right" id="railRight">
  <div class="rail-head">
    <h3>✅ 已完成 <span class="n" id="rightCount">0</span></h3>
    <button onclick="toggleRail('right', false)" title="收起">✕</button>
  </div>
  <div class="rail-body" id="railRightBody">
    <div class="hist-empty">暂无已完成的解包</div>
  </div>
  <div class="rail-foot">点击「下载」保存文件，「复制」获取完整路径</div>
</div>

<button class="rail-fab left" id="fabLeft" onclick="toggleRail('left', true)">
  <span class="dot"></span><span id="fabLeftText">解包中</span>
</button>
<button class="rail-fab right" id="fabRight" onclick="toggleRail('right', true)">
  <span class="dot ok"></span><span id="fabRightText">已完成</span>
</button>

<script>
const $ = id => document.getElementById(id);

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $('panel-' + t.dataset.tab).classList.add('active');
    if (t.dataset.tab === 'library') loadProjects();
  };
});

// ---------- 拖拽上传 ----------
const dz = $('dropzone');
dz.onclick = () => $('fileInput').click();
['dragenter','dragover'].forEach(e => dz.addEventListener(e, ev => {
  ev.preventDefault(); dz.classList.add('dragover');
}));
['dragleave','drop'].forEach(e => dz.addEventListener(e, ev => {
  ev.preventDefault(); dz.classList.remove('dragover');
}));
dz.addEventListener('drop', ev => uploadFiles(ev.dataTransfer.files));
$('fileInput').onchange = e => uploadFiles(e.target.files);

async function uploadFiles(files) {
  if (!files.length) return;
  $('uploadMsg').innerHTML = '<div class="msg">上传中 <span class="spin">⟳</span></div>';
  let ok = 0, fail = 0;
  for (const f of files) {
    const fd = new FormData();
    fd.append('file', f);
    try {
      const r = await fetch('/api/upload', { method: 'POST', body: fd });
      const j = await r.json();
      if (r.ok && j.ok) ok++; else fail++;
    } catch (e) { fail++; }
  }
  $('uploadMsg').innerHTML = `<div class="msg ${fail ? 'err' : 'ok'}">上传完成：成功 ${ok} 个${fail ? '，失败 ' + fail + ' 个' : ''}</div>`;
  loadProjects();
}

// ---------- 目录扫描 ----------
$('scanBtn').onclick = async () => {
  const dir = $('scanDir').value.trim();
  if (!dir) { $('scanMsg').innerHTML = '<div class="msg err">请填写目录路径</div>'; return; }
  $('scanBtn').disabled = true;
  $('scanMsg').innerHTML = '<div class="msg">扫描中 <span class="spin">⟳</span></div>';
  const fd = new FormData();
  fd.append('directory', dir);
  fd.append('recursive', $('scanRecursive').checked);
  try {
    const r = await fetch('/api/scan', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) {
      $('scanMsg').innerHTML = `<div class="msg err">${j.detail || '扫描失败'}</div>`;
    } else {
      $('scanMsg').innerHTML = `<div class="msg ${j.count ? 'ok' : 'err'}">扫描完成，发现 ${j.count} 个工程</div>`;
      if (j.history) renderHistory(j.history);
      loadProjects();
    }
  } catch (e) {
    $('scanMsg').innerHTML = '<div class="msg err">请求失败: ' + e + '</div>';
  }
  $('scanBtn').disabled = false;
};

// ---------- 目录历史 ----------
async function loadHistory() {
  try {
    const r = await fetch('/api/scan/history');
    const j = await r.json();
    renderHistory(j.history || []);
  } catch (e) { /* 历史是便利功能，失败不影响主流程 */ }
}

function renderHistory(items) {
  const el = $('scanHistory');
  if (!items || !items.length) {
    el.innerHTML = '<div class="hist-empty">暂无扫描记录</div>';
    return;
  }
  // 用 JSON.stringify 生成 JS 字符串字面量，安全处理引号/反斜杠
  const lit = s => JSON.stringify(String(s));
  el.innerHTML = `<div class="f-label" style="margin-bottom:6px;">扫描历史</div>` +
    items.map(h => `
      <div class="h-item" onclick="useHistoryPath(${lit(h.path)})">
        <span class="h-path" title="${h.path}">${h.path}</span>
        ${h.count ? `<span class="h-count">${h.count}</span>` : ''}
        <button class="h-del" title="删除记录"
                onclick="event.stopPropagation();deleteHistory(${lit(h.path)})">✕</button>
      </div>`).join('');
}

function useHistoryPath(path) {
  $('scanDir').value = path;
  $('scanDir').focus();
}

async function deleteHistory(path) {
  try {
    const fd = new FormData();
    fd.append('path', path);
    const r = await fetch('/api/scan/history/delete', { method: 'POST', body: fd });
    const j = await r.json();
    renderHistory(j.history || []);
  } catch (e) { /* 忽略 */ }
}

// ---------- 工程库 ----------
let selected = new Set();
let page = 1;          // 当前页码（1 起）
let pageSize = 12;     // 每页条数
let allProjects = [];  // 全量工程（分页用）
let filterOptions = { kinds: [], ratings: [], tags: [] };

// 筛选条件
const filters = { kind: '', rating: '', tag: '', keyword: '' };
let filterTimer = null;

function applyFilters() {
  filters.kind = $('filterKind').value;
  filters.rating = $('filterRating').value;
  filters.tag = $('filterTag').value;
  page = 1;
  loadProjects();
}

function debouncedFilter() {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => {
    filters.keyword = $('filterKeyword').value.trim();
    page = 1;
    loadProjects();
  }, 300);
}

function resetFilters() {
  $('filterKind').value = '';
  $('filterRating').value = '';
  $('filterTag').value = '';
  $('filterKeyword').value = '';
  filters.kind = filters.rating = filters.tag = filters.keyword = '';
  page = 1;
  loadProjects();
}

// 用后端返回的可选值填充下拉框
function renderFilterOptions(opts) {
  filterOptions = opts || { kinds: [], ratings: [], tags: [] };

  // 类型 / 分级的中文名（后端已归一化大小写）
  const KIND_LABELS = {
    scene: '场景', wallpaper: '壁纸', video: '视频', web: '网页',
  };
  const RATING_LABELS = {
    Everyone: '所有人', Teen: '青少年',
    Questionable: '存疑', Mature: '成熟', Adult: '成人',
  };

  const fill = (el, values, labels, current) => {
    const keep = el.value;
    // labels.map 是「值 -> 中文名」映射表；没有映射就显示原值
    const nameOf = v => (labels.map && labels.map[v]) || v;
    el.innerHTML = `<option value="">${labels.all}</option>` +
      values.map(v => `<option value="${v}">${nameOf(v)}</option>`).join('');
    el.value = values.includes(keep) ? keep : current;
  };

  fill($('filterKind'), filterOptions.kinds,
    { all: '全部类型', map: KIND_LABELS }, filters.kind);
  fill($('filterRating'), filterOptions.ratings,
    { all: '全部分级', map: RATING_LABELS }, filters.rating);
  fill($('filterTag'), filterOptions.tags,
    { all: '全部标签' }, filters.tag);
}

async function loadProjects() {
  try {
    const params = new URLSearchParams();
    if (filters.kind) params.set('kind', filters.kind);
    if (filters.rating) params.set('rating', filters.rating);
    if (filters.tag) params.set('tag', filters.tag);
    if (filters.keyword) params.set('keyword', filters.keyword);

    const r = await fetch('/api/projects?' + params.toString());
    const j = await r.json();
    const ps = j.projects || [];
    allProjects = ps;
    renderFilterOptions(j.filters);
    $('count').textContent = `(${j.total != null ? j.total : ps.length})`;
    $('libEmpty').style.display = ps.length ? 'none' : 'block';

    // 清理已不存在的选中项
    const ids = new Set(ps.map(p => p.id));
    for (const id of [...selected]) if (!ids.has(id)) selected.delete(id);

    const totalPages = Math.max(1, Math.ceil(ps.length / pageSize));
    if (page > totalPages) page = totalPages;
    const start = (page - 1) * pageSize;
    const slice = ps.slice(start, start + pageSize);

    $('grid').innerHTML = slice.map(p => {
      const meta = p.meta || {};
      const badges = [];
      if (meta.kind) badges.push(`<span class="badge kind">${meta.kind_label || meta.kind}</span>`);
      if (meta.content_rating)
        badges.push(`<span class="badge rating-${meta.content_rating}">${meta.content_rating_label || meta.content_rating}</span>`);
      return `
      <div class="wall ${selected.has(p.id) ? 'sel' : ''}" data-id="${p.id}">
        <label class="pick" onclick="event.stopPropagation()">
          <input type="checkbox" ${selected.has(p.id) ? 'checked' : ''}
                 onchange="toggleSelect('${p.id}', this.checked)">
        </label>
        <div class="thumb" onclick="showPreview('${p.id}')">
          <div class="side" onclick="event.stopPropagation()">
            <button onclick="doExtract('${p.id}')" title="解包到 ${p.output_dir || 'out/'}">📦</button>
          </div>
          ${p.has_preview
            ? (p.preview_type === 'mp4'
                ? `<video src="/api/preview/${p.id}" autoplay loop muted playsinline></video>`
                : `<img src="/api/preview/${p.id}" loading="lazy">`)
            : '<span class="ph">无预览</span>'}
          <div class="play">▶</div>
        </div>
        <div class="info">
          <div class="title" title="${p.title}">${p.title}</div>
          <div class="meta">
            ${badges.join(' ')}
            ${meta.tags && meta.tags.length ? `<span class="badge kind">${meta.tags.slice(0, 3).join(' / ')}</span>` : ''}
          </div>
          <div class="meta">${p.entry_count} 个条目 · ${p.source === 'scan' ? '目录扫描' : '上传'}</div>
          ${p.output_dir ? `<div class="meta path" title="${p.output_dir}">${p.output_dir}</div>` : ''}
        </div>
        <div class="actions">
          <button class="ghost" onclick="showEntries('${p.id}')">条目</button>
          ${p.extracted
            ? `<button class="ghost" onclick="openOutDir('${p.id}')">📂 打开目录</button>`
            : ''}
        </div>
      </div>`;
    }).join('');

    renderPager(totalPages);
    updateSelUI();
  } catch (e) { console.error(e); }
}

function renderPager(totalPages) {
  const total = allProjects.length;
  if (total === 0) { $('pager').innerHTML = ''; return; }

  // 页码按钮：当前页附近省略
  const nums = [];
  const push = n => { if (!nums.includes(n) && n >= 1 && n <= totalPages) nums.push(n); };
  push(1); push(2);
  for (let i = page - 1; i <= page + 1; i++) push(i);
  push(totalPages - 1); push(totalPages);
  nums.sort((a, b) => a - b);

  let html = `<button onclick="gotoPage(${page - 1})" ${page === 1 ? 'disabled' : ''}>‹</button>`;
  let last = 0;
  for (const n of nums) {
    if (last && n - last > 1) html += `<span class="info">…</span>`;
    html += `<button class="${n === page ? 'cur' : ''}" onclick="gotoPage(${n})">${n}</button>`;
    last = n;
  }
  html += `<button onclick="gotoPage(${page + 1})" ${page === totalPages ? 'disabled' : ''}>›</button>`;

  const from = (page - 1) * pageSize + 1;
  const to = Math.min(page * pageSize, total);
  html += `<span class="info">${from}-${to} / ${total}</span>`;
  html += `<select onchange="setPageSize(this.value)">${
    [6, 12, 24, 48, 96].map(n =>
      `<option value="${n}" ${n === pageSize ? 'selected' : ''}>${n} 条/页</option>`
    ).join('')
  }</select>`;

  $('pager').innerHTML = html;
}

function gotoPage(n) {
  const totalPages = Math.max(1, Math.ceil(allProjects.length / pageSize));
  if (n < 1 || n > totalPages) return;
  page = n;
  loadProjects();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setPageSize(n) {
  pageSize = parseInt(n, 10) || 12;
  page = 1;
  loadProjects();
}

function toggleSelect(id, checked) {
  if (checked) selected.add(id); else selected.delete(id);
  const card = document.querySelector(`.wall[data-id="${id}"]`);
  if (card) card.classList.toggle('sel', checked);
  updateSelUI();
}

function toggleSelectAll(checked) {
  // 只作用于当前页显示的卡片
  document.querySelectorAll('#grid .pick input').forEach(cb => {
    cb.checked = checked;
    const id = cb.closest('.wall').dataset.id;
    if (checked) selected.add(id); else selected.delete(id);
  });
  document.querySelectorAll('#grid .wall').forEach(c => c.classList.toggle('sel', checked));
  updateSelUI();
}

function updateSelUI() {
  const n = selected.size;
  $('selCount').textContent = `已选 ${n} 个`;
  $('delBtn').disabled = n === 0;
  // querySelectorAll 返回 NodeList，没有 every，要先转成数组
  const all = Array.from(document.querySelectorAll('#grid .pick input'));
  const allChecked = all.length > 0 && all.every(cb => cb.checked);
  $('selAll').checked = allChecked;
}

async function deleteSelected() {
  const ids = [...selected];
  if (!ids.length) return;
  const withFiles = $('delFiles').checked;
  const msg = withFiles
    ? `确定要删除所选的 ${ids.length} 个工程吗？\n\n包含已解包的文件，这些文件会从磁盘永久删除。`
    : `确定要从列表中移除所选的 ${ids.length} 个工程吗？\n\n（不删除已解包的文件）`;
  if (!confirm(msg)) return;

  $('delBtn').disabled = true;
  try {
    const fd = new FormData();
    fd.append('ids', ids.join(','));
    fd.append('delete_files', withFiles);
    const r = await fetch('/api/projects/delete', { method: 'POST', body: fd });
    const j = await r.json();
    selected.clear();
    $('libMsg').innerHTML = `<div class="msg ${j.ok ? 'ok' : 'err'}">
      已删除 ${j.deleted_count} 个工程${j.not_found.length ? '（' + j.not_found.length + ' 个不存在）' : ''}
      ${j.deleted.some(d => d.removed_files) ? '<br>同时删除了解包产物' : ''}
    </div>`;
    loadProjects();
  } catch (e) {
    $('libMsg').innerHTML = '<div class="msg err">删除失败</div>';
  }
  $('delBtn').disabled = false;
}

function showPreview(id) {
  const el = document.querySelector(`[onclick="showPreview('${id}')"]`);
  const isVideo = el && el.querySelector('video');
  $('mTitle').textContent = '预览';
  $('mBody').innerHTML = isVideo
    ? `<video src="/api/preview/${id}" autoplay loop controls style="max-height:70vh"></video>`
    : `<img src="/api/preview/${id}">`;
  $('modal').classList.add('open');
}
function closeModal() { $('modal').classList.remove('open'); }
$('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };

async function showEntries(id) {
  $('eTitle').textContent = '包内条目';
  $('eBody').innerHTML = '<div style="color:var(--muted);padding:8px">加载中...</div>';
  $('entriesModal').classList.add('open');
  try {
    const r = await fetch('/api/entries/' + id);
    const j = await r.json();
    $('eTitle').textContent = `包内条目 (${j.entries.length}) · magic=${j.magic}`;
    $('eBody').innerHTML = j.entries.map(e =>
      `<div><span class="path">${e.path}</span><span class="len">${e.length} B · ${e.type}</span></div>`
    ).join('');
  } catch (e) {
    $('eBody').innerHTML = '<div style="color:var(--danger)">加载失败</div>';
  }
}

async function doExtract(id) {
  const btn = document.querySelector(`.wall[data-id="${id}"] .side button`);
  if (btn) { btn.classList.add('busy'); btn.textContent = '⏳'; }
  try {
    const fd = new FormData();
    fd.append('output_dir', '');
    const r = await fetch('/api/extract/' + id, { method: 'POST', body: fd });
    const j = await r.json();
    if (!j.ok) {
      $('libMsg').innerHTML = '<div class="msg err">解包启动失败</div>';
      toast('解包启动失败', 'err');
      return;
    }
    // 解包在后台执行，左侧栏显示进度
    addTask(j.task_id, { name: j.output_dir ? j.output_dir.split(/[\\/]/).pop() : '' });
    openRail('left');
    toast('解包已开始，可在左侧栏查看进度', 'ok');
    pollTask(j.task_id);
  } catch (e) {
    $('libMsg').innerHTML = '<div class="msg err">解包失败</div>';
    toast('解包失败', 'err');
  } finally {
    if (btn) { btn.classList.remove('busy'); btn.textContent = '📦'; }
  }
}

function closeResult() {
  $('libMsg').innerHTML = '';
  $('libMsg').classList.remove('sticky');
}

// ---------- 任务侧栏 ----------

// taskId -> 任务状态
const tasks = new Map();

function toggleRail(side, open) {
  const el = side === 'left' ? $('railLeft') : $('railRight');
  el.classList.toggle('open', open);
  syncRailBodyClass(side);
  updateFabs();
}

function openRail(side) {
  const el = side === 'left' ? $('railLeft') : $('railRight');
  el.classList.add('open');
  syncRailBodyClass(side);
  updateFabs();
}

// 主内容让位（避免被侧栏盖住）
function syncRailBodyClass(side) {
  const cls = side === 'left' ? 'rail-left-open' : 'rail-right-open';
  const el = side === 'left' ? $('railLeft') : $('railRight');
  document.body.classList.toggle(cls, el.classList.contains('open'));
}

function updateFabs() {
  const running = [...tasks.values()].filter(t => !t.finished).length;
  const done = [...tasks.values()].filter(t => t.finished && t.status === 'done').length;

  const leftOpen = $('railLeft').classList.contains('open');
  const rightOpen = $('railRight').classList.contains('open');

  $('fabLeft').classList.toggle('show', !leftOpen && running > 0);
  $('fabLeftText').textContent = `解包中 ${running}`;

  $('fabRight').classList.toggle('show', !rightOpen && done > 0);
  $('fabRightText').textContent = `已完成 ${done}`;
}

function addTask(taskId, info = {}) {
  tasks.set(taskId, {
    id: taskId,
    name: info.name || '解包任务',
    status: 'running',
    percent: 0,
    current: 0,
    total: 0,
    current_entry: '',
    error: '',
    finished: false,
  });
  renderRails();
}

function renderRails() {
  const all = [...tasks.values()];
  const running = all.filter(t => !t.finished);
  const finished = all.filter(t => t.finished).sort((a, b) => (b.finished_at || 0) - (a.finished_at || 0));

  $('leftCount').textContent = running.length;
  $('rightCount').textContent = finished.length;

  // 左侧：进行中
  $('railLeftBody').innerHTML = running.length
    ? running.map(t => {
        const pct = Math.max(0, Math.min(100, t.percent || 0));
        return `<div class="task" data-task="${t.id}">
          <div class="t-name" title="${t.name}">${t.name}</div>
          <div class="t-bar"><i style="width:${pct}%"></i></div>
          <div class="t-meta"><span>${t.current || 0} / ${t.total || '?'}</span><span>${pct}%</span></div>
          ${t.current_entry ? `<div class="t-file" title="${t.current_entry}">${t.current_entry}</div>` : ''}
          ${t.error ? `<div class="t-err">${t.error}</div>` : ''}
        </div>`;
      }).join('')
    : '<div class="hist-empty">暂无进行中的任务</div>';

  // 右侧：已完成（带下载 / 复制路径）
  const lit = s => JSON.stringify(String(s));
  $('railRightBody').innerHTML = finished.length
    ? finished.map(t => {
        const cls = t.status === 'done' ? 'done' : 'error';
        const media = t.media || [];
        const mediaRows = media.map(m => `
          <div class="t-mrow">
            <span class="t-mname" title="${m.name}">${m.name}</span>
            <span class="t-mbtns">
              <a class="mbtn dl" href="${m.url}" download="${m.name}" title="下载 ${m.name}"
                 onclick="event.stopPropagation()">⬇ 下载</a>
              <button class="mbtn cp" onclick="event.stopPropagation();copyPath(${lit(m.path)})"
                      title="复制完整路径">📋 复制</button>
            </span>
          </div>`).join('');
        return `<div class="task ${cls}" data-task="${t.id}" onclick="showTaskById('${t.id}')" style="cursor:pointer;">
          <div class="t-name" title="${t.name}">${t.name}</div>
          <div class="t-bar"><i style="width:100%"></i></div>
          <div class="t-meta">
            <span>${t.status === 'done'
              ? `${t.files_written || 0} 文件 · ${t.media_count || 0} 媒体`
              : '失败'}</span>
            <span>${t.status === 'done' ? '完成' : '错误'}</span>
          </div>
          ${t.error ? `<div class="t-err">${t.error}</div>` : ''}
          ${mediaRows ? `<div class="t-media">${mediaRows}</div>` : ''}
        </div>`;
      }).join('')
    : '<div class="hist-empty">暂无已完成的解包</div>';

  updateFabs();
}

async function pollTask(taskId) {
  try {
    const r = await fetch('/api/task/' + taskId);
    const j = await r.json();
    if (!j.ok) return;
    const t = j.task;
    tasks.set(taskId, { ...(tasks.get(taskId) || {}), ...t });
    renderRails();

    if (!t.finished) {
      setTimeout(() => pollTask(taskId), 400);
    } else {
      onTaskDone(t);
    }
  } catch (e) {
    setTimeout(() => pollTask(taskId), 1200);
  }
}

function onTaskDone(t) {
  if (t.status === 'done') {
    toast(`解包完成 · ${t.media_count || 0} 个媒体`, 'ok');
    // 右侧栏自动弹出，方便立刻找到刚解出来的东西
    openRail('right');
    // 结果面板也展示完整媒体网格（大图预览 + 下载/复制）
    showTaskResult(t);
  } else {
    toast('解包失败: ' + (t.error || '未知错误'), 'err');
  }
  loadProjects();
}

// 展示某个已完成任务的完整结果
function showTaskResult(t) {
  const media = t.media || [];
  $('libMsg').innerHTML = `<button class="close-result" onclick="closeResult()">✕</button>
    <div class="msg ok">
    解包到 <code>${t.output_dir || ''}</code><br>
    文件 ${t.files_written || 0} · 图片 ${t.images_written || 0} · 媒体 ${t.media_count || 0}
    ${media.length ? renderMedia(media) : ''}
  </div>`;
  $('libMsg').classList.add('sticky');
}

// 点击右侧栏的已完成任务，重新展示它的完整结果
async function showTaskById(taskId) {
  const t = tasks.get(taskId);
  if (!t) return;
  if (!t.media || !t.media.length) {
    // 没有媒体信息时重新拉一次
    try {
      const r = await fetch('/api/task/' + taskId);
      const j = await r.json();
      if (j.ok) {
        tasks.set(taskId, { ...t, ...j.task });
        showTaskResult(j.task);
        return;
      }
    } catch (e) { /* 忽略 */ }
  }
  showTaskResult(t);
}

// 在文件管理器中打开该工程的输出目录
async function openOutDir(id) {
  try {
    const fd = new FormData();
    fd.append('path', '');
    fd.append('project_id', id);
    const r = await fetch('/api/reveal', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.ok) toast(j.message || '已打开目录', 'ok');
    else toast(j.message || '打开失败', 'err');
  } catch (e) {
    toast('打开失败', 'err');
  }
}

function renderMedia(media) {
  const lit = s => JSON.stringify(String(s));
  const items = media.map(m => `
    <div class="media-item">
      <div class="media-thumb" onclick="revealPath(${lit(m.path)})" title="在文件管理器中查看">
        ${m.kind === 'video'
          ? `<video src="${m.url}" muted loop autoplay playsinline></video>`
          : `<img src="${m.url}" loading="lazy">`}
        <div class="media-overlay">📂 在文件夹中显示</div>
      </div>
      <div class="media-info">
        <div class="media-name" title="${m.name}">${m.name}</div>
        <div class="media-size">${(m.size/1024).toFixed(1)} KB · ${m.extension.toUpperCase()}</div>
      </div>
      <div class="media-btns">
        <a class="media-dl" href="${m.url}" download="${m.name}"
           title="下载 ${m.name}" onclick="event.stopPropagation()">⬇ 下载</a>
        <button class="media-copy" onclick="copyPath(${lit(m.path)});event.stopPropagation()"
                title="复制完整路径">📋 复制</button>
      </div>
    </div>`).join('');
  return `<div class="media-box">
    <div class="media-title">图片 / 视频（${media.length}）· 目录 <code>media/</code> · 点击缩略图可在文件夹中显示</div>
    <div class="media-grid">${items}</div>
  </div>`;
}

// 在系统文件管理器中定位文件
async function revealPath(path) {
  try {
    const fd = new FormData();
    fd.append('path', path);
    const r = await fetch('/api/reveal', { method: 'POST', body: fd });
    const j = await r.json();
    toast(j.ok ? j.message : '打开失败：' + j.message, j.ok ? 'ok' : 'err');
  } catch (e) {
    toast('打开失败', 'err');
  }
}

// 复制文件路径到剪贴板
async function copyPath(path) {
  try {
    const fd = new FormData();
    fd.append('text', path);
    const r = await fetch('/api/copy', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.ok) {
      toast('路径已复制：' + path, 'ok');
    } else {
      // 后端复制失败时，退回到浏览器剪贴板 API
      try {
        await navigator.clipboard.writeText(path);
        toast('路径已复制：' + path, 'ok');
      } catch (e) {
        toast('复制失败，路径：' + path, 'err');
      }
    }
  } catch (e) {
    toast('复制失败', 'err');
  }
}

// 轻量提示条
let toastTimer = null;
function toast(msg, kind) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'toast show ' + (kind || 'ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

loadProjects();
loadHistory();
</script>
</body>
</html>
